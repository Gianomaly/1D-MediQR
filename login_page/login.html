<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediQR_Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
<main>  
    <div class="app">

        <header>
            <h1>MediQR</h1>
            <p>SECURE PATIENT INFORMATION SYSTEM</p>
        </header>

        <section>
            <h1> Welcome Back</h1>
            <p> Sign in to securely access patient information. </p>
        </section>
    
    <div class="login-container">
        <form id="login-form" action="/login" method="POST">
            <div class="form-group">
                <label for="username">USERNAME OR STAFF ID</label>
                <br>
                <input type="text" id="username" name="username" placeholder="Enter your staff ID"required>
            </div>
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <br>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <br>
                <a href="MediQR-Password-Reset.html" class="forgot-password">Forgot Password?</a>
            </div>
            <button type="submit">Sign In</button>
        </form>

        <p>or</p>

        <a href="MediQR-Biometrics-Login.html" class="biometrics-login">Sign in with Biometrics</a>
        <p>Authorized healthcare personel only</p>

        <hr>
        <p>Don't have an account? <a href="MediQR-Register.html">Sign Up</a></p>

        <hr>

        <p> Your access in protected and monitored.</p>


</main>

    <script src="login.js"></script>

</body>
</html>
