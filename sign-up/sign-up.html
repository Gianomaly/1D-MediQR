<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediQR - Create Account</title>
  <link rel="stylesheet" href="sign-up.css">
  <script src="https://kit.fontawesome.com/464eb7faeb.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

  <div class="auth-container">
    
    <header class="auth-header">
      <div class="logo-image-wrapper">
        <img src="../logo\logo.png" alt="MediQR Logo" class="brand-logo-img" />
      </div>
      <h1 class="brand-name">MediQR</h1>
      <p class="brand-subtitle">SECURE PATIENT INFORMATION SYSTEM</p>
    </header>

    <main class="auth-form-section">
      <h2 class="welcome-heading">Create Account</h2>
      <p class="welcome-subtext">Register your staff profile to request system access.</p>

      <form class="auth-form">
        
        <div class="form-group">
          <label for="fullname">FULL NAME</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user field-icon"></i>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="staffid">USERNAME OR STAFF ID</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card field-icon"></i>
            <input type="text" id="staffid" placeholder="Enter your staff ID" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">PASSWORD</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-key field-icon"></i>
            <input type="password" id="password" placeholder="Create a strong password" required>
            <i class="fa-solid fa-eye-slash toggle-password-icon"></i>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>
      </form>

      <div class="form-divider">
        <span>OR</span>
      </div>

      <div class="alternative-action">
        <p>Already have an account? <a href="../login_page\login.html" class="auth-link">Sign In</a></p>
      </div>

      <p class="notice-text">Authorized healthcare personnel only</p>
    </main>

    <footer class="auth-footer">
      <i class="fa-solid fa-lock security-icon"></i>
      <span class="security-text">Your access is protected and monitored.</span>
    </footer>

  </div>

</body>
</html>
